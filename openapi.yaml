openapi: 3.0.3
info:
  title: Encounter Progress Backend
  version: 1.0.0
  description: Shared API exposed by both backend implementations: Node REST and Nakama/PostgreSQL.
servers:
  - url: http://127.0.0.1:8080
    description: Node REST backend
  - url: http://127.0.0.1:8081
    description: Nakama backend HTTP port
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service status
  /worlds/{worldId}/seed:
    get:
      summary: Get deterministic world generation seed
      parameters:
        - $ref: "#/components/parameters/worldId"
      responses:
        "200":
          description: World seed used by the demo map and runtime region generation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldSeed"
  /worlds/{worldId}/regions/{regionId}/stream-state:
    get:
      summary: Get current stream state for a region
      parameters:
        - $ref: "#/components/parameters/worldId"
        - $ref: "#/components/parameters/regionId"
      responses:
        "200":
          description: Region stream state
    post:
      summary: Update current stream state for a region
      parameters:
        - $ref: "#/components/parameters/worldId"
        - $ref: "#/components/parameters/regionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegionStreamStateUpdate"
      responses:
        "200":
          description: Updated stream state
  /worlds/{worldId}/parties/{partyId}/players:
    get:
      summary: Get fresh player poses for a party
      parameters:
        - $ref: "#/components/parameters/worldId"
        - $ref: "#/components/parameters/partyId"
      responses:
        "200":
          description: Active party player poses
  /worlds/{worldId}/parties/{partyId}/runtime-state:
    get:
      summary: Get party runtime generation state
      description: Returns the current transient generation seed used for party-local mobs and chests. If the party was occupied and is now empty, the backend advances this generation and resets transient region stream state.
      parameters:
        - $ref: "#/components/parameters/worldId"
        - $ref: "#/components/parameters/partyId"
      responses:
        "200":
          description: Party runtime state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyRuntimeState"
  /worlds/{worldId}/parties/{partyId}/players/{playerId}/pose:
    post:
      summary: Update a player's party pose
      parameters:
        - $ref: "#/components/parameters/worldId"
        - $ref: "#/components/parameters/partyId"
        - $ref: "#/components/parameters/playerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerPoseUpdate"
      responses:
        "200":
          description: Pose accepted
  /worlds/{worldId}/regions/{regionId}/parties/{partyId}/players/{playerId}/encounters/completed:
    get:
      summary: Get completed encounters for a scoped player/party
      parameters:
        - $ref: "#/components/parameters/worldId"
        - $ref: "#/components/parameters/regionId"
        - $ref: "#/components/parameters/partyId"
        - $ref: "#/components/parameters/playerId"
      responses:
        "200":
          description: Completed encounter list
    delete:
      summary: Clear completed encounters for a scoped player/party
      parameters:
        - $ref: "#/components/parameters/worldId"
        - $ref: "#/components/parameters/regionId"
        - $ref: "#/components/parameters/partyId"
        - $ref: "#/components/parameters/playerId"
      responses:
        "200":
          description: Cleared progress
  /worlds/{worldId}/regions/{regionId}/parties/{partyId}/players/{playerId}/encounters/{encounterId}/completed:
    post:
      summary: Mark an encounter completed
      parameters:
        - $ref: "#/components/parameters/worldId"
        - $ref: "#/components/parameters/regionId"
        - $ref: "#/components/parameters/partyId"
        - $ref: "#/components/parameters/playerId"
        - $ref: "#/components/parameters/encounterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EncounterCompletion"
      responses:
        "200":
          description: Completion accepted
components:
  parameters:
    worldId:
      name: worldId
      in: path
      required: true
      schema:
        type: string
    regionId:
      name: regionId
      in: path
      required: true
      schema:
        type: string
    partyId:
      name: partyId
      in: path
      required: true
      schema:
        type: string
    playerId:
      name: playerId
      in: path
      required: true
      schema:
        type: string
    encounterId:
      name: encounterId
      in: path
      required: true
      schema:
        type: string
  schemas:
    WorldSeed:
      type: object
      properties:
        worldId:
          type: string
        seed:
          type: integer
          example: 421337
        config:
          $ref: "#/components/schemas/WorldConfig"
    WorldConfig:
      type: object
      properties:
        tileSize:
          type: number
          example: 3900
        gridColumns:
          type: integer
          example: 10
        gridRows:
          type: integer
          example: 8
        worldWidth:
          type: number
          example: 39000
        worldHeight:
          type: number
          example: 31200
    EncounterCompletion:
      type: object
      properties:
        reward:
          type: object
          properties:
            rewardId:
              type: string
            amount:
              type: integer
        source:
          type: string
          example: ue-client
    RegionStreamStateUpdate:
      type: object
      properties:
        loaded:
          type: boolean
        nearbyPlayerCount:
          type: integer
        partyId:
          type: string
        playerId:
          type: string
        source:
          type: string
          example: ue-server
    PlayerPoseUpdate:
      type: object
      required:
        - x
        - y
        - z
        - yaw
      properties:
        x:
          type: number
        y:
          type: number
        z:
          type: number
        yaw:
          type: number
        provider:
          type: string
          example: LocalRest
        source:
          type: string
          example: ue-client
    PartyRuntimeState:
      type: object
      properties:
        worldId:
          type: string
        partyId:
          type: string
        generation:
          type: integer
          example: 2
        runtimeSeed:
          type: integer
          format: int64
          example: 3807520931
        activePlayerCount:
          type: integer
          example: 0
        wasOccupied:
          type: boolean
        emptySince:
          type: string
          nullable: true
        lastActiveAt:
          type: string
          nullable: true
        lastResetAt:
          type: string
          nullable: true
        resetReason:
          type: string
          example: party-empty
        transientState:
          type: object
          properties:
            mobs:
              type: string
              example: regenerated-from-seed
            chests:
              type: string
              example: regenerated-from-seed
