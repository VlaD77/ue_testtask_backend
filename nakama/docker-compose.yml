services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nakama"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - nakama-postgres-data:/var/lib/postgresql/data

  nakama:
    platform: linux/amd64
    build:
      context: .
      args:
        NAKAMA_VERSION: "3.31.0"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /nakama/nakama migrate up --database.address "postgres:localdb@postgres:5432/nakama?sslmode=disable"
        exec /nakama/nakama \
          --name nakama1 \
          --database.address "postgres:localdb@postgres:5432/nakama?sslmode=disable" \
          --logger.level DEBUG \
          --runtime.path /nakama/data/modules \
          --runtime.http_key defaulthttpkey \
          --socket.server_key defaultkey \
          --session.encryption_key defaultencryptionkey \
          --console.username admin \
          --console.password password
    ports:
      - "8081:7350"
      - "7351:7351"
      - "7349:7349"

volumes:
  nakama-postgres-data:
